<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <title>VoltSPDA - Inspeção e Levantamento</title>
    <link rel="manifest" href="manifest-voltspda.json">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --primary: #2563eb;
            --accent: #f59e0b;
            --cyan: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 40px;
        }
        header {
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            padding: 16px;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 20px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        header small { color: var(--muted); font-size: 12px; display: block; }
        .badge-offline {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.4);
            font-weight: bold;
        }
        .tabs {
            display: flex;
            background: #1e293b;
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 6px;
            background: none;
            border: none;
            color: var(--muted);
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(245, 158, 11, 0.08);
        }
        .container {
            max-width: 740px;
            margin: 0 auto;
            padding: 14px;
        }
        .section { display: none; }
        .section.active { display: block; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .card h2 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 140px; }
        label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 14px;
            margin-bottom: 10px;
        }
        textarea { min-height: 70px; resize: vertical; }
        .chk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13.5px;
        }
        .chk-item:last-child { border-bottom: none; }
        .chk-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .st-btn {
            padding: 6px 9px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--muted);
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
        }
        .st-btn.ok.active { background: rgba(16, 185, 129, 0.25); border-color: var(--success); color: #6ee7b7; }
        .st-btn.nok.active { background: rgba(239, 68, 68, 0.25); border-color: var(--danger); color: #fca5a5; }
        .st-btn.na.active { background: rgba(148, 163, 184, 0.2); border-color: var(--muted); color: #f8fafc; }
        .med-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr auto;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }
        .med-row input { margin-bottom: 0; font-size: 13px; padding: 8px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 14px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
            width: 100%;
            margin-top: 8px;
        }
        .btn-primary { background: var(--primary); }
        .btn-success { background: var(--success); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            width: auto;
            margin-top: 0;
            font-size: 12px;
        }
        .report-box {
            background: #091020;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            white-space: pre-wrap;
            font-size: 12.5px;
            line-height: 1.45;
            color: #e2e8f0;
        }
        @media print {
            header, .tabs, .btn, .no-print { display: none !important; }
            body { background: #fff; color: #000; padding: 0; }
            .section { display: block !important; }
            .card, .report-box { background: #fff; color: #000; border-color: #999; }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>⚡ VoltSPDA</h1>
        <small>Levantamento e Inspeção — NBR 5419</small>
    </div>
    <span class="badge-offline">OFFLINE</span>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab('tab-edif', this)">Edificação</button>
    <button class="tab-btn" onclick="openTab('tab-chk', this)">Checklist</button>
    <button class="tab-btn" onclick="openTab('tab-med', this)">Medições</button>
    <button class="tab-btn" onclick="openTab('tab-rel', this)">Relatório</button>
</div>

<div class="container">

    <!-- ABA 1: EDIFICAÇÃO -->
    <div id="tab-edif" class="section active">
        <div class="card">
            <h2>Dados da Edificação e Sistema</h2>
            <label>Cliente / Condomínio / Empresa</label>
            <input type="text" id="ed-cliente" placeholder="Ex.: Condomínio Residencial / Galpão">

            <label>Endereço / Local da Inspeção</label>
            <input type="text" id="ed-local" placeholder="Rua, número, bairro, cidade">

            <div class="row">
                <div class="col">
                    <label>Nível de Proteção</label>
                    <select id="ed-nivel">
                        <option value="Classe I">Classe I (200 m)</option>
                        <option value="Classe II">Classe II (100 m)</option>
                        <option value="Classe III" selected>Classe III (60 m)</option>
                        <option value="Classe IV">Classe IV (20 m)</option>
                    </select>
                </div>
                <div class="col">
                    <label>Tipo de Sistema</label>
                    <select id="ed-tipo">
                        <option value="Franklin (Captor)">Franklin (Captor)</option>
                        <option value="Malha / Gaiola de Faraday">Malha / Gaiola de Faraday</option>
                        <option value="Misto / Estrutural">Misto / Estrutural</option>
                    </select>
                </div>
            </div>

            <label>Responsável pela Inspeção</label>
            <input type="text" id="ed-resp" placeholder="Nome / Registro">
        </div>
    </div>

    <!-- ABA 2: CHECKLIST NBR 5419 -->
    <div id="tab-chk" class="section">
        <div class="card">
            <h2>Inspeção Visual por Subsistema</h2>
            <div id="chk-list"></div>
        </div>
        <div class="card">
            <h2>Não Conformidades e Pendências</h2>
            <textarea id="chk-pend" placeholder="Descreva pontos oxidados, cabos soltos, caixas quebradas ou falta de DPS..."></textarea>
        </div>
    </div>

    <!-- ABA 3: MEDIÇÕES -->
    <div id="tab-med" class="section">
        <div class="card">
            <h2>Continuidade e Resistência de Aterramento</h2>
            <div id="med-rows"></div>
            <button class="btn btn-outline no-print" onclick="addMedRow()">+ Adicionar Ponto de Medição</button>
        </div>
    </div>

    <!-- ABA 4: RELATÓRIO -->
    <div id="tab-rel" class="section">
        <div class="card">
            <h2>Resumo Técnico do Levantamento</h2>
            <div id="rel-preview" class="report-box"></div>
            <button class="btn btn-success no-print" onclick="shareWhatsApp()">💬 Enviar Resumo no WhatsApp</button>
            <button class="btn btn-primary no-print" onclick="window.print()">🖨️ Salvar / Imprimir PDF</button>
        </div>
    </div>

</div>

<script>
const ITENS_CHK = [
    'Captores e mastros fixados com firmeza e sem oxidação severa',
    'Condutores de descida íntegros, bem fixados e sem emendas irregulares',
    'Caixas de inspeção de aterramento acessíveis e identificadas',
    'Barramento de Equipotencialização Principal (BEP) interligado',
    'DPS presentes nos quadros de entrada e distribuição com sinalização OK',
    'Distâncias de segurança / isolação respeitadas nas estruturas metálicas'
];

let estadosChk = ITENS_CHK.map(() => 'OK');

function openTab(tabId, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
    if (tabId === 'tab-rel') buildReport();
}

function renderChecklist() {
    const el = document.getElementById('chk-list');
    el.innerHTML = ITENS_CHK.map((txt, idx) => {
        const st = estadosChk[idx];
        return `<div class="chk-item">
            <span>${txt}</span>
            <div class="chk-btns">
                <button type="button" class="st-btn ok ${st==='OK'?'active':''}" onclick="setChk(${idx},'OK')">OK</button>
                <button type="button" class="st-btn nok ${st==='N/C'?'active':''}" onclick="setChk(${idx},'N/C')">N/C</button>
                <button type="button" class="st-btn na ${st==='N/A'?'active':''}" onclick="setChk(${idx},'N/A')">N/A</button>
            </div>
        </div>`;
    }).join('');
}

function setChk(idx, val) {
    estadosChk[idx] = val;
    renderChecklist();
}

function addMedRow(ponto = '', cont = '', terr = '') {
    const wrap = document.getElementById('med-rows');
    const div = document.createElement('div');
    div.className = 'med-row';
    div.innerHTML = `
        <input type="text" placeholder="Ponto (ex.: Descida 1)" value="${ponto}">
        <input type="text" placeholder="Cont. (Ω)" value="${cont}">
        <input type="text" placeholder="Terra (Ω)" value="${terr}">
        <button type="button" class="btn btn-outline" onclick="this.parentElement.remove()">✕</button>
    `;
    wrap.appendChild(div);
}

function getReportText() {
    const cli = document.getElementById('ed-cliente').value || 'Não informado';
    const loc = document.getElementById('ed-local').value || 'Não informado';
    const niv = document.getElementById('ed-nivel').value;
    const tip = document.getElementById('ed-tipo').value;
    const resp = document.getElementById('ed-resp').value || 'Não informado';
    const pend = document.getElementById('chk-pend').value || 'Nenhuma pendência registrada.';

    const ncCount = estadosChk.filter(x => x === 'N/C').length;
    const chkLines = ITENS_CHK.map((t, i) => `[${estadosChk[i]}] ${t}`).join('\n');

    const medLines = [...document.querySelectorAll('#med-rows .med-row')].map(r => {
        const inp = r.querySelectorAll('input');
        const p = inp[0].value || 'Ponto';
        const c = inp[1].value || '-';
        const t = inp[2].value || '-';
        return `• ${p}: Continuidade ${c} Ω | Aterramento ${t} Ω`;
    }).join('\n') || 'Sem medições lançadas.';

    return `LEVANTAMENTO SPDA (NBR 5419)\n` +
        `Cliente: ${cli}\nLocal: ${loc}\nNível: ${niv} | Sistema: ${tip}\nResponsável: ${resp}\n` +
        `Não conformidades encontradas: ${ncCount}\n\n` +
        `--- CHECKLIST ---\n${chkLines}\n\n` +
        `--- MEDIÇÕES ---\n${medLines}\n\n` +
        `--- PENDÊNCIAS / OBSERVAÇÕES ---\n${pend}`;
}

function buildReport() {
    document.getElementById('rel-preview').innerText = getReportText();
}

function shareWhatsApp() {
    const txt = getReportText();
    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

window.addEventListener('DOMContentLoaded', () => {
    renderChecklist();
    addMedRow('Descida / Caixa 01', '', '');
    addMedRow('Descida / Caixa 02', '', '');
    buildReport();
});

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

</body>
</html>
