<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <title>VoltAero - Ação Elétrica no Ar</title>
    <link rel="manifest" href="manifest-voltaero.json">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 800px;
            background: linear-gradient(to bottom, #1e3a8a, #3b82f6);
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            z-index: 10;
            pointer-events: none;
        }
        #battery-bar {
            width: 100px;
            height: 15px;
            background: #475569;
            border: 2px solid #fff;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }
        #battery-fill {
            width: 100%;
            height: 100%;
            background: #fbbf24;
            transition: width 0.1s;
        }
        #menu, #game-over {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }
        #game-over { display: none; }
        h1 {
            color: #f59e0b;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 3px 3px #000;
        }
        .subtitle {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-weight: bold;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        .instructions {
            margin-top: 30px;
            font-size: 14px;
            color: #cbd5e1;
            max-width: 280px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div>
            DISTÂNCIA: <span id="score-val">0m</span>
        </div>
        <div>
            ENERGIA
            <div id="battery-bar"><div id="battery-fill"></div></div>
        </div>
    </div>

    <!-- Menu Inicial -->
    <div id="menu">
        <h1>VOLTAERO</h1>
        <div class="subtitle">Ação Elétrica no Ar! ⚡🛩️</div>
        <button onclick="startGame()">DECOLAR!</button>
        <div class="instructions">
            <b>COMO JOGAR:</b><br>
            Mantenha o dedo pressionado na tela para o avião SUBIR, solte para DESCER.<br><br>
            Colete baterias 🔋 para manter o motor ligado e evite as nuvens de tempestade 🌩️!
        </div>
    </div>

    <!-- Tela de Game Over -->
    <div id="game-over">
        <h1 style="color: #ef4444;">PANE ELÉTRICA!</h1>
        <p style="font-size: 20px;">Você voou <span id="final-score" style="color: #fbbf24; font-weight: bold;">0m</span>!</p>
        <button onclick="restartGame()">TENTAR OUTRA VEZ</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreVal = document.getElementById('score-val');
const batteryFill = document.getElementById('battery-fill');
const menu = document.getElementById('menu');
const gameOverScreen = document.getElementById('game-over');
const finalScore = document.getElementById('final-score');

function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
resize();
window.addEventListener('resize', resize);

let gameActive = false;
let score = 0;
let battery = 100;
let pressing = false;

const player = {
    x: 50,
    y: 200,
    vy: 0,
    width: 50,
    height: 35,
    gravity: 0.25,
    thrust: -0.5
};

let obstacles = [];
let items = [];
let particles = [];
let frameCount = 0;

// Controles no canvas para não travar os botões do menu
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); pressing = true; }, { passive: false });
window.addEventListener('touchend', () => { pressing = false; });
canvas.addEventListener('mousedown', () => { pressing = true; });
window.addEventListener('mouseup', () => { pressing = false; });

function startGame() {
    menu.style.display = 'none';
    gameOverScreen.style.display = 'none';
    resetData();
    gameActive = true;
    animate();
}

function restartGame() {
    gameOverScreen.style.display = 'none';
    resetData();
    gameActive = true;
    animate();
}

function resetData() {
    player.y = canvas.height / 2;
    player.vy = 0;
    score = 0;
    battery = 100;
    obstacles = [];
    items = [];
    particles = [];
    frameCount = 0;
    scoreVal.innerText = '0m';
    batteryFill.style.width = '100%';
}

function triggerGameOver() {
    gameActive = false;
    pressing = false;
    finalScore.innerText = score + 'm';
    gameOverScreen.style.display = 'flex';
}

function spawnEntities() {
    frameCount++;

    if (frameCount % 90 === 0) {
        const size = Math.random() * 40 + 30;
        obstacles.push({
            x: canvas.width,
            y: Math.random() * (canvas.height - 100) + 50,
            width: size,
            height: size * 0.7,
            speed: Math.random() * 2 + 3
        });
    }

    if (frameCount % 120 === 0) {
        items.push({
            x: canvas.width,
            y: Math.random() * (canvas.height - 100) + 50,
            width: 25,
            height: 30,
            speed: 3
        });
    }
}

function drawBackground() {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.beginPath();
    ctx.arc(100, 150, 40, 0, Math.PI * 2);
    ctx.arc(140, 140, 50, 0, Math.PI * 2);
    ctx.arc(180, 150, 40, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(canvas.width - 150, 280, 50, 0, Math.PI * 2);
    ctx.arc(canvas.width - 100, 270, 60, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
    ctx.rotate(player.vy * 0.05);

    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.ellipse(0, 0, 25, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.ellipse(-5, 0, 20, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(25, -15);
    ctx.lineTo(25, 15);
    ctx.stroke();

    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-10, 0, 12, 18);

    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(3, -5, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    if (Math.random() > 0.4) {
        particles.push({
            x: player.x,
            y: player.y + player.height / 2,
            vx: -Math.random() * 2 - 1,
            vy: (Math.random() - 0.5) * 2,
            size: Math.random() * 4 + 2,
            color: pressing ? '#60a5fa' : '#cbd5e1'
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.size *= 0.96;
        if (p.size < 0.5) {
            particles.splice(i, 1);
            continue;
        }
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function handlePhysics() {
    if (pressing) {
        player.vy += player.thrust;
    } else {
        player.vy += player.gravity;
    }

    player.vy = Math.max(-5, Math.min(5, player.vy));
    player.y += player.vy;

    if (player.y < 0) { player.y = 0; player.vy = 0; }
    if (player.y + player.height > canvas.height) { triggerGameOver(); }

    battery -= 0.07;
    batteryFill.style.width = Math.max(0, battery) + '%';
    if (battery <= 0) { triggerGameOver(); }

    if (frameCount % 10 === 0) {
        score++;
        scoreVal.innerText = score + 'm';
    }
}

function checkCollisions(obj, width, height) {
    return player.x < obj.x + width &&
           player.x + player.width > obj.x &&
           player.y < obj.y + height &&
           player.y + player.height > obj.y;
}

function animate() {
    if (!gameActive) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground();
    spawnEntities();
    handlePhysics();
    updateParticles();
    drawPlayer();

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= obs.speed;

        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.width/2, 0, Math.PI*2);
        ctx.arc(obs.x + 10, obs.y - 10, obs.width/2.5, 0, Math.PI*2);
        ctx.arc(obs.x - 10, obs.y - 5, obs.width/2.5, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(obs.x - 5, obs.y + 5);
        ctx.lineTo(obs.x + 5, obs.y + 5);
        ctx.lineTo(obs.x - 2, obs.y + 15);
        ctx.fill();

        if (checkCollisions(obs, obs.width, obs.height)) {
            triggerGameOver();
            return;
        }

        if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
        }
    }

    for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.x -= item.speed;

        ctx.fillStyle = '#10b981';
        ctx.fillRect(item.x, item.y, item.width, item.height);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(item.x + 5, item.y - 4, item.width - 10, 4);

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(item.x + 12, item.y + 8);
        ctx.lineTo(item.x + 17, item.y + 14);
        ctx.lineTo(item.x + 13, item.y + 14);
        ctx.lineTo(item.x + 15, item.y + 22);
        ctx.lineTo(item.x + 10, item.y + 16);
        ctx.lineTo(item.x + 14, item.y + 16);
        ctx.closePath();
        ctx.fill();

        if (checkCollisions(item, item.width, item.height)) {
            battery = Math.min(100, battery + 25);
            for (let p = 0; p < 8; p++) {
                particles.push({
                    x: item.x,
                    y: item.y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    size: Math.random() * 5 + 3,
                    color: '#fbbf24'
                });
            }
            items.splice(i, 1);
            continue;
        }

        if (item.x + item.width < 0) {
            items.splice(i, 1);
        }
    }

    requestAnimationFrame(animate);
}

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

</body>
</html>
